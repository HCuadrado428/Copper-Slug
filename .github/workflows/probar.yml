name: Probar en el juego

# Después de cada compilación: arranca un servidor dedicado con el mod en cada cargador (¿carga sin petar?) y el juego
# de verdad sin pantalla (Xvfb + gráficos por software) con MC-Runtime-Test, que crea un mundo. En Forge y Fabric,
# dentro del mundo, PruebaCI prueba las armas sacando capturas (con y sin shaders); en NeoForge solo se comprueba que
# se llega al mundo sin errores. Lo que sale (capturas, registros, resumen) se sube como artefacto y a la prerelease.

on:
  # Ya no se lanza solo tras cada compilación (gastaba minutos y las pruebas se probaban a mano con el jar):
  # solo a mano, desde Actions > Run workflow.
  workflow_dispatch:
    inputs:
      build:
        description: Número de build a probar (vacío = la última)
        required: false

permissions:
  contents: write
  actions: read

env:
  MC: "1.20.1"
  FORGE: "47.3.0"
  NEOFORGE: "47.1.106"
  FABRIC_LOADER: "0.16.9"

jobs:
  preparar:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="${{ github.event.inputs.build }}"
          if [ -z "$B" ]; then B="${{ github.event.workflow_run.run_number }}"; fi
          if [ -z "$B" ]; then B=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" -q '[.[] | select(.tag_name | startswith("build-"))][0].tag_name' | sed 's/build-//'); fi
          echo "build=$B" >> "$GITHUB_OUTPUT"
          echo "Build a probar: $B"
      - name: Bajar los jars y las dependencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p forge fabric shaders-forge shaders-fabric shaderpacks
          gh release download "build-${{ steps.n.outputs.build }}" -R "$GITHUB_REPOSITORY" -D jars -p '*.jar'
          ls -la jars
          cp jars/*forge-${MC}*.jar forge/
          cp jars/*fabric-${MC}*.jar fabric/
          cp jars/bloomberto-*${MC}-forge.jar forge/
          cp jars/bloomberto-*${MC}-fabric.jar fabric/
          bajar() {  # bajar <slug> <cargador> <carpeta>: la última versión para ese cargador y MC en Modrinth
            url=$(curl -sf "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22$2%22%5D&game_versions=%5B%22${MC}%22%5D" \
                  | jq -r '(([.[] | select(.version_type=="release")] + .)[0].files // []) | ((map(select(.primary))[0] // .[0]).url // "null")' || true)
            if [ -n "$url" ] && [ "$url" != "null" ]; then curl -sfL -o "$3/$1.jar" "$url" && echo "$1 ($2): $url"; else echo "::warning::No encuentro $1 para $2 en Modrinth"; fi
          }
          bajar fabric-api fabric fabric
          # con shaders: Embeddium + Oculus en Forge, Sodium + Iris en Fabric, y un pack ligero
          bajar embeddium forge shaders-forge
          bajar oculus forge shaders-forge
          bajar sodium fabric shaders-fabric
          bajar iris fabric shaders-fabric
          for p in miniature-shader vanilla-plus-shader complementary-reimagined; do
            url=$(curl -sf "https://api.modrinth.com/v2/project/$p/version" | jq -r '.[0].files[0].url // "null"' || true)
            if [ -n "$url" ] && [ "$url" != "null" ]; then curl -sfL -o "shaderpacks/$p.zip" "$url" && echo "pack: $p $url" && break; fi
          done
          ls -la forge fabric shaders-forge shaders-fabric shaderpacks
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            forge
            fabric
            shaders-forge
            shaders-fabric
            shaderpacks

  servidor:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cargador: [forge, neoforge, fabric]
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mods
      - name: Instalar el servidor (${{ matrix.cargador }})
        run: |
          mkdir -p srv/mods
          case "${{ matrix.cargador }}" in
            forge)
              curl -sfL -o instalador.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC}-${FORGE}/forge-${MC}-${FORGE}-installer.jar"
              java -jar instalador.jar --installServer srv > instalar.log 2>&1 || (tail -40 instalar.log; exit 1)
              cp forge/*.jar srv/mods/ ;;
            neoforge)
              # NeoForge 1.20.1 (47.1): carga el mismo jar que Forge
              curl -sfL -o instalador.jar "https://maven.neoforged.net/releases/net/neoforged/forge/${MC}-${NEOFORGE}/forge-${MC}-${NEOFORGE}-installer.jar"
              java -jar instalador.jar --installServer srv > instalar.log 2>&1 || (tail -40 instalar.log; exit 1)
              cp forge/*.jar srv/mods/ ;;
            fabric)
              curl -sfL -o srv/server.jar "https://meta.fabricmc.net/v2/versions/loader/${MC}/${FABRIC_LOADER}/1.0.1/server/jar"
              printf '#!/bin/sh\nexec java -Xmx2G -jar server.jar "$@"\n' > srv/run.sh && chmod +x srv/run.sh
              cp fabric/*.jar srv/mods/ ;;
          esac
          cd srv
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-npcs=false\nview-distance=4\nsimulation-distance=4\n' > server.properties
          ls mods
      - name: Arrancar y parar el servidor
        run: |
          cd srv
          mkfifo entrada
          (tail -f entrada | timeout 600 ./run.sh nogui > servidor.log 2>&1; echo "salida $?" > salida.txt) &
          exec 3>entrada
          for i in $(seq 1 540); do
            if grep -q 'Done (' servidor.log; then echo "Arrancado en ${i}s"; break; fi
            if [ -f salida.txt ]; then echo "El servidor se ha parado solo"; break; fi
            sleep 1
          done
          sleep 15                     # unos ticks con el mundo cargado
          echo stop >&3
          for i in $(seq 1 90); do grep -q 'All dimensions are saved' servidor.log && break; sleep 1; done
          grep -q 'All dimensions are saved' servidor.log && echo "Parado bien" || echo "::warning::El servidor no terminó de pararse"
          echo "----- líneas de Copper Slug y errores -----"
          grep -n -i -E 'copper ?slug|exception|error' servidor.log | grep -v -i 'Error loading class' | head -80 || true
          if grep -E '(ERROR|FATAL)' servidor.log | grep -i -q 'copper ?slug'; then echo "::error::Errores de Copper Slug en el servidor"; exit 1; fi
          if ! grep -q 'Copper Slug cargado' servidor.log && ! grep -q 'Copper Slug cargado' logs/latest.log 2>/dev/null; then echo "::error::El mod no se ha cargado"; tail -80 servidor.log; exit 1; fi
          if ! grep -q 'Done (' servidor.log; then echo "::error::El servidor no llegó a arrancar"; tail -80 servidor.log; exit 1; fi
          if ls crash-reports/*.txt >/dev/null 2>&1; then echo "::error::Hay informe de crash"; cat crash-reports/*.txt | head -120; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: servidor-${{ matrix.cargador }}
          path: |
            srv/servidor.log
            srv/logs/
            srv/crash-reports/

  cliente:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cargador: forge, shaders: false, prueba: true}
          - {cargador: forge, shaders: true, prueba: true}
          - {cargador: fabric, shaders: false, prueba: true}
          - {cargador: fabric, shaders: true, prueba: true}
          - {cargador: neoforge, shaders: false, prueba: false}
    env:
      NOMBRE: ${{ format('{0}-{1}{2}', matrix.cargador, '1.20.1', matrix.shaders && '-shaders' || '') }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: mods
      - name: Poner los mods
        run: |
          mkdir -p run/mods run/config
          case "${{ matrix.cargador }}" in
            fabric) cp fabric/*.jar run/mods/ ;;
            *) cp forge/*.jar run/mods/ ;;
          esac
          printf 'lang:es_es\n' > run/options.txt     # en castellano, como lo juegan
          if [ "${{ matrix.shaders }}" = "true" ]; then
            cp shaders-${{ matrix.cargador }}/*.jar run/mods/
            mkdir -p run/shaderpacks && cp shaderpacks/*.zip run/shaderpacks/
            PACK=$(ls shaderpacks | head -1)
            printf 'enableShaders=true\nshaderPack=%s\n' "$PACK" > run/config/oculus.properties
            printf 'enableShaders=true\nshaderPack=%s\n' "$PACK" > run/config/iris.properties
          fi
          ls run/mods
      - name: Abrir el juego (y probar las armas)
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ env.MC }}
          modloader: ${{ matrix.cargador }}
          # NeoForge 1.20.1 es compatible con Forge: el mod de MC-Runtime-Test de Forge vale
          mc-runtime-test: ${{ matrix.cargador == 'fabric' && 'fabric' || 'forge' }}
          java: 17
          headlessmc-command: --jvm "-Djava.awt.headless=true -Dcopperslug.prueba=${{ matrix.prueba }} -Xmx3G"
      - name: Resumen
        if: always()
        run: |
          cat run/prueba_copperslug.txt 2>/dev/null || echo "No hay resumen (la prueba no llegó al final)"
          ls run/screenshots 2>/dev/null || true
          grep -n -E 'PruebaCI|Copper Slug' run/logs/latest.log 2>/dev/null | head -80 || true
      - name: Comprobar
        run: |
          L=run/logs/latest.log
          if ! grep -q 'Copper Slug cargado' $L; then echo "::error::El mod no se ha cargado"; exit 1; fi
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then echo "::error::Hay informe de crash"; head -80 run/crash-reports/*.txt; exit 1; fi
          if grep -E '\[(ERROR|FATAL)\]|/ERROR\]|/FATAL\]' $L | grep -i -E 'copper ?slug' | grep -v '\[PruebaCI\] falló el paso' | grep -q .; then
            echo "::error::Errores de Copper Slug en el registro"; grep -E 'ERROR|FATAL' $L | grep -i -E 'copper ?slug' | head -40; exit 1
          fi
          if [ "${{ matrix.prueba }}" = "true" ]; then
            tail -1 run/prueba_copperslug.txt | grep -q 'TODO BIEN' || { echo "::error::La prueba de las armas no ha salido bien"; grep -E 'FALLO|AVISO' run/prueba_copperslug.txt | head -60; exit 1; }
          fi
          echo "TODO BIEN"
      - name: Juntar lo que ha salido
        if: always()
        run: |
          mkdir -p sal
          cp -r run/screenshots sal/ 2>/dev/null || true
          cp run/prueba_copperslug.txt sal/ 2>/dev/null || true
          cp run/logs/latest.log sal/ 2>/dev/null || true
          cp -r run/crash-reports sal/ 2>/dev/null || true
          echo "build ${{ needs.preparar.outputs.build }}" > sal/build.txt
          (cd sal && zip -qr ../prueba-${NOMBRE}.zip .)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cliente-${{ env.NOMBRE }}
          path: sal/
      - name: Subir el resultado a la prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "build-${{ needs.preparar.outputs.build }}" "prueba-${NOMBRE}.zip" --clobber -R "$GITHUB_REPOSITORY"
