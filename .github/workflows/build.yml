name: Compilar

# Compila los jars de todos los cargadores de esta rama (main = 1.20.1: Forge y Fabric; 1.21.1: NeoForge, Fabric y
# Forge) y los sube como artefacto y como prerelease build-N. No se publican releases con número de versión.

on:
  push:
    branches: [main, main-nuevo, '1.21.1']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          # la descarga de Gradle a veces falla (504): se reintenta antes de compilar
          for i in 1 2 3 4 5 6; do ./gradlew --version >/dev/null 2>&1 && break; echo "Gradle no se ha podido descargar (intento $i), reintento en 30 s"; sleep 30; done
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Recoger los jars
        run: |
          mkdir -p jars
          for d in */build/libs; do
            for j in "$d"/*.jar; do
              case "$j" in *-sources.jar|*-javadoc.jar|*-dev*.jar|*/common/*) ;; *) cp "$j" jars/ ;; esac
            done
          done
          ls -la jars
      - name: Guardar el registro de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: copperslug-jars
          path: jars/*.jar
      - name: Publicar los jars en una prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Copper Slug build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: Build de CI de la rama ${{ github.ref_name }} (${{ github.sha }}). No es una versión publicada.
          files: jars/*.jar
