# Copper Slug: las nueve armas de fuego de Miscelánea como mod aparte (multiloader: common + forge + fabric).
# Ojo: el id de fabric.mod.json no se expande; si cambia mod_id hay que cambiarlo allí a mano.

# Proyecto
version=1.0.0
group=com.copperslug
java_version=17

# Común
minecraft_version=1.20.1
mod_name=Copper Slug
mod_author=caihugus
mod_id=copperslug
license=All Rights Reserved
credits=
description=Nine copper firearms from the Wild West and beyond: revolver, scoped rifle, pressure shotgun, Gatling, Winchester, Derringer, Thompson, musket and hand cannon.
minecraft_version_range=[1.20.1,1.20.2)
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.2+1.20.1
fabric_loader_version=0.16.9

# Forge: se compila contra 47.1.3 (la base de NeoForge 1.20.1) para que el mismo jar cargue en NeoForge 47.1
forge_version=47.1.3
forge_loader_version_range=[47,)
forge_version_range=[47,)

# JEI (opcional, solo la API para compilar)
jei_version=15.20.0.106

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
